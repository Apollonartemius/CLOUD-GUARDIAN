# CloudGuardian AI - Real Cloud Deployment via Render (Phase 6)
# ------------------------------------------------------------------
# Render Blueprint: deploys the exact same simulated-service (the
# real main.py + Dockerfile used locally, unmodified) as a genuinely
# real, free web service on Render's infrastructure - no credit card
# required, unlike the major hyperscalers.
#
# This is Render's own infrastructure-as-code format (a "Blueprint"),
# which Render recommends over community/generic Terraform providers
# for Render-only setups: https://render.com/docs/blueprint-spec
#
# How to use: push this repo to GitHub, then in the Render dashboard
# choose "New +" -> "Blueprint" and point it at your repo. Render
# reads this file automatically from the repo root. See the main
# README for full step-by-step instructions.

services:
  - type: web
    name: cloudguardian-cloud-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/simulated-service/Dockerfile
    dockerContext: ./services/simulated-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: SERVICE_NAME
        value: cloud-service-render
      - key: BASE_CPU
        value: "18"
      - key: BASE_MEM
        value: "280"
      - key: BASE_LATENCY_MS
        value: "55"
  - type: web
    name: cloudguardian-forecast-engine
    runtime: docker
    plan: free
    dockerfilePath: ./services/forecast-engine/Dockerfile
    dockerContext: ./services/forecast-engine
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: cloudguardian-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CPU_THRESHOLD_PERCENT
        value: "85"
      - key: MEMORY_THRESHOLD_MB
        value: "800"
      - key: LATENCY_THRESHOLD_MS
        value: "400"
      - key: ERROR_RATE_THRESHOLD
        value: "0.15"
  - type: web
    name: cloudguardian-ai-reasoning-agent
    runtime: docker
    plan: free
    dockerfilePath: ./services/ai-reasoning-agent/Dockerfile
    dockerContext: ./services/ai-reasoning-agent
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: cloudguardian-db
          property: connectionString
      - key: FORECAST_ENGINE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: cloudguardian-db
    plan: free
    databaseName: cloudguardian
    user: cloudguardian
