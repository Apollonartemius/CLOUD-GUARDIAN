# CloudGuardian AI - Platform Stack (Phase 6+)
# ------------------------------------------------
# As of Phase 6, the 3 monitored microservices (auth-service,
# payment-service, inventory-service) are no longer defined here -
# they're provisioned by Terraform in terraform/local-infra/, as real
# infrastructure-as-code. This file now owns the observability and
# self-healing PLATFORM: Prometheus, Grafana, Postgres, the
# metrics-collector, anomaly-detector, decision-engine, dashboard, and
# LocalStack (simulated AWS for the multi-cloud piece).
#
# Run order: `terraform apply` in terraform/local-infra/ FIRST (creates
# the shared network + the 3 services), THEN `docker compose up --build`
# here. See the main README for the full walkthrough.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - cloudguardian

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: cloudguardian
      POSTGRES_PASSWORD: cloudguardian
      POSTGRES_DB: cloudguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudguardian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguardian -d cloudguardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  metrics-collector:
    build: ./services/metrics-collector
    container_name: metrics-collector
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DATABASE_URL: postgresql://cloudguardian:cloudguardian@postgres:5432/cloudguardian
      POLL_INTERVAL_SECONDS: 15
    ports:
      - "8010:8000"
    networks:
      - cloudguardian
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy

  anomaly-detector:
    build: ./services/anomaly-detector
    container_name: anomaly-detector
    environment:
      DATABASE_URL: postgresql://cloudguardian:cloudguardian@postgres:5432/cloudguardian
      CHECK_INTERVAL_SECONDS: 15
      ROLLING_WINDOW: 80
      ZSCORE_THRESHOLD: 3.0
      IF_RETRAIN_INTERVAL_SECONDS: 300
      IF_MIN_TRAINING_ROWS: 50
    ports:
      - "8020:8000"
    networks:
      - cloudguardian
    depends_on:
      postgres:
        condition: service_healthy
      metrics-collector:
        condition: service_started

  decision-engine:
    build: ./services/decision-engine
    container_name: decision-engine
    environment:
      DATABASE_URL: postgresql://cloudguardian:cloudguardian@postgres:5432/cloudguardian
      DECISION_CHECK_INTERVAL_SECONDS: 20
      TRIGGER_WINDOW_SECONDS: 45
      MIN_ANOMALY_COUNT: 2
      CONFIDENCE_THRESHOLD: 0.7
      COOLDOWN_SECONDS: 180
      VERIFICATION_DELAY_SECONDS: 40
    ports:
      - "8030:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cloudguardian
    depends_on:
      postgres:
        condition: service_healthy
      anomaly-detector:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - cloudguardian
    depends_on:
      - prometheus

  dashboard:
    build: ./services/dashboard
    container_name: dashboard
    ports:
      - "3001:80"
    networks:
      - cloudguardian
    depends_on:
      - metrics-collector
      - anomaly-detector
      - decision-engine

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    networks:
      - cloudguardian
    volumes:
      - localstack-data:/var/lib/localstack

networks:
  cloudguardian:
    name: cloudguardian-net
    external: true # created by `terraform apply` in terraform/local-infra/ - run that first

volumes:
  grafana-data:
  postgres-data:
  localstack-data:
