server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must always revalidate: it is the SPA shell that references
    # the currently-deployed hashed bundle. If a browser caches it, a later
    # rebuild deletes the old assets and cached pages resolve to 404s (seen as
    # a blank dashboard in cached tabs while incognito worked).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Hashed, immutable build assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # everything else (SPA routes) revalidates the shell too
        add_header Cache-Control "no-cache";
    }
}