server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;   # docker embedded DNS (lazy fleet upstreams)

    # index.html must always revalidate: it is the SPA shell that references
    # the currently-deployed hashed bundle. If a browser caches it, a later
    # rebuild deletes the old assets and cached pages resolve to 404s (seen as
    # a blank dashboard in cached tabs while incognito worked).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Hashed, immutable build assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy: the dashboard and every backend share ONE origin,
    # so the browser never needs cross-origin requests. This is required behind
    # tunneling proxies (e.g. GitHub Codespaces) that don't forward OPTIONS
    # preflight requests cleanly, and it avoids CORS entirely everywhere else.
    # Each location strips its prefix and proxies to the backend's root.
    location /api/metrics/ {
        proxy_pass http://metrics-collector:8000/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/anomaly/ {
        proxy_pass http://anomaly-detector:8000/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/decision/ {
        proxy_pass http://decision-engine:8000/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/forecast/ {
        proxy_pass http://forecast-engine:8000/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/ai/ {
        proxy_pass http://ai-reasoning-agent:8000/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                       # SSE streaming for the copilot
        proxy_read_timeout 315s;
    }
    # Monitored fleet (k3d nodeports published on the docker host). Resolved
    # lazily so the dashboard boots even when that path is unavailable (e.g.
    # Codespaces' docker-outside-of-docker has no host-gateway mapping) - such
    # requests just return 502 for the fleet cards instead of killing nginx.
    location /api/fleet/auth/ {
        set $fleet_upstream "host.docker.internal:8001";
        rewrite ^/api/fleet/auth/(.*)$ /$1 break;
        proxy_pass http://$fleet_upstream;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/fleet/payment/ {
        set $fleet_upstream "host.docker.internal:8002";
        rewrite ^/api/fleet/payment/(.*)$ /$1 break;
        proxy_pass http://$fleet_upstream;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /api/fleet/inventory/ {
        set $fleet_upstream "host.docker.internal:8003";
        rewrite ^/api/fleet/inventory/(.*)$ /$1 break;
        proxy_pass http://$fleet_upstream;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # everything else (SPA routes) revalidates the shell too
        add_header Cache-Control "no-cache";
    }
}