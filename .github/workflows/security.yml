name: security-and-unit-tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: ruff + pytest (python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime + test dependencies
        run: |
          pip install --upgrade pip
          awk 'FNR==1 && NR>1 {print "\n"} {print}' services/*/requirements.txt > /tmp/cloudguardian-requirements.txt
          pip install -r /tmp/cloudguardian-requirements.txt
          pip install pytest ruff numpy pandas PyYAML python-dateutil
      - name: Lint
        run: ruff check services/ tests/
      - name: Unit + integration tests
        env:
          JWT_SECRET: dummy-jwt-for-tests
        run: pytest -q

  pip-audit:
    name: dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit each service dependency set
        working-directory: services
        run: |
          for req in */requirements.txt; do
            echo "::group::auditing $req"
            pip-audit -r "$req"
            echo "::endgroup::"
          done

  trivy:
    name: file/dependency vulnerability scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (services + k8s manifests)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
      - name: Scan Dockerfiles / infra configs too
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/*/Dockerfile
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-docker-results.sarif
          ignore-unfixed: true
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - name: Upload Docker SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-docker-results.sarif

  secret-scan:
    name: secret leak detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}