name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install ruff pytest statsmodels pandas numpy prometheus-client psycopg2-binary scikit-learn

      - name: Ruff lint
        run: ruff check services/ tests/ conftest.py

      - name: Pytest
        run: pytest tests/ services/ -q

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  terraform-validate:
    name: Terraform Validate (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [local-infra, aws-simulated, gcp-real]
    defaults:
      run:
        working-directory: terraform/${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Init (backend disabled)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
