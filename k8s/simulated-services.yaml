---
# HorizontalPodAutoscalers - the "scale" half of industrial self-healing.
# When a pod's CPU crosses its request threshold (a percentage of requested
# CPU), Kubernetes automatically adds replicas. The decision-engine's chaos
# tests drive this so you can watch a single payment pod scale out under load.
#
# Payment uses a higher threshold (80%) than the others because its simulated
# base CPU (~25m) sits very close to a 50% threshold, which made the HPA
# scale up and down on ordinary traffic wobble. 80% keeps normal traffic
# below the trigger while a cpu_spike chaos (which jumps to ~4x base CPU)
# still crosses it cleanly.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: default
spec:
