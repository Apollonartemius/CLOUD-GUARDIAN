# NodePort services: expose each Deployment on the cluster's 30xxx range.
# k3d maps host ports 8001/8002/8003 -> node ports 30001/30002/30003 so
# Prometheus + the dashboard + chaos injection keep working unchanged.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001
      protocol: TCP
      name: http
---
