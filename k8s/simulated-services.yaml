# CloudGuardian AI - Phase 7 (Kubernetes)
# ---------------------------------------------------------------------------
# The 3 monitored services now run as real Kubernetes Deployments (not plain
# Docker containers). Each service:
#   - runs with a base CPU/memory/latency profile (same env vars as before)
#   - is wrapped in a NodePort Service (30001..30003) so Prometheus and the
#     chaos endpoints keep working on the same host ports (8001..8003)
#   - has a HorizontalPodAutoscaler (HPA) driven by CPU so Kubernetes can
#     auto-scale replicas when a service is under pressure
#   - exposes the /metrics endpoint at :8000 for prometheus scraping
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
    tier: monitored-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: monitored-service
    spec:
      containers:
        - name: simulated-service
          image: cloudguardian-ai-simulated-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SERVICE_NAME
              value: "auth-service"
            - name: BASE_CPU
              value: "15"
            - name: BASE_MEM
              value: "250"
            - name: BASE_LATENCY_MS
              value: "40"
            - name: BASE_ERROR_RATE
              value: "0.005"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
