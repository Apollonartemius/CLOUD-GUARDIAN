# CloudGuardian AI - Alembic configuration (schema versioning, gap #4)
# Migrations are the source of truth for the schema. Services still
# auto-create tables idempotently at startup as a safety net, so this is
# purely additive (versioned, reversible DDL + rollback capability).
#
# DATABASE_URL is read from the environment; the default matches the
# compose stack. Examples:
#   DATABASE_URL=postgresql://...:5432/cloudguardian alembic upgrade head
#   alembic history / alembic downgrade 0000
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S