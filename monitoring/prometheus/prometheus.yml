global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Sophisticated: auth/payment/inventory are now Kubernetes (k3d) pods,
  # exposed on the host via nodeports mapped to 8001/8002/8003. Prometheus
  # scrapes through the host gateway.
  - job_name: "auth-service"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["host.docker.internal:8003"]

  - job_name: "forecast-engine"
    static_configs:
      - targets: ["forecast-engine:8000"]

  - job_name: "ai-reasoning-agent"
    static_configs:
      - targets: ["ai-reasoning-agent:8000"]

  - job_name: "metrics-collector"
    static_configs:
      - targets: ["metrics-collector:8000"]

  - job_name: "anomaly-detector"
    static_configs:
      - targets: ["anomaly-detector:8000"]

  - job_name: "decision-engine"
    static_configs:
      - targets: ["decision-engine:8000"]

  - job_name: "cloud-service-render"
    scheme: https
    static_configs:
      - targets: ["cloudguardian-cloud-service.onrender.com"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
