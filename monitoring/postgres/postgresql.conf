# CloudGuardian primary (postgres) - enables WAL archiving (continuous PITR)
# and streaming replication (HA replica). Applied via `-c config_file` in
# docker-compose so the data volume is never modified.
#
# WAL segments are archived to the shared `cloudguardian-wal` volume so a
# disabled point-in-time recovery server can replay them later - the same
# pattern as shipping WAL to object storage in production.

wal_level = replica
max_wal_senders = 10
wal_keep_size = 256MB
hot_standby = on

archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp "%p" "/var/lib/postgresql/wal_archive/%f"'

# Managed auth rules (includes explicit replication-from-network record
# used by the pg-replica standby).
hba_file = '/etc/postgresql/pg_hba.conf'

# Postgres 16 config file is split; keep every other default.
listen_addresses = '0.0.0.0'