# CloudGuardian HA standby (pg-replica). Accepts read-only traffic
# (hot_standby) while continuously streaming WAL from the primary via
# primary_conninfo written by pg_basebackup -R into postgresql.auto.conf.

port = 5432
listen_addresses = '0.0.0.0'
hot_standby = on
max_connections = 400
wal_level = replica
max_wal_senders = 10