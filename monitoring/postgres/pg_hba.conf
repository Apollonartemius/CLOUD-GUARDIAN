# CloudGuardian managed pg_hba.conf (mounted read-only, set via hba_file).
# Mirrors the postgres image defaults plus one explicit replication record
# so the pg-replica standby can stream from the primary over the compose
# network (scram), while docker-entrypoint still trusts local socket/loopback.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix-domain socket + loopback (postgres image defaults)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Compose network: streaming replication (standby) and normal app traffic
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256